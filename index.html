body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--tx); min-height:100vh; line-height:1.5; letter-spacing:-0.01em; }
.H { background:rgba(0,0,0,0.8); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--bd); padding:16px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }

@media(max-width:500px){ .G{grid-template-columns:1fr 1fr} .c{padding:10px 14px; font-size:13px} .mobile-only { display: block; } .ft{display:none} }
</style>

<script>
function J(p){return p.filter(function(x){return x&&String(x).trim().length>0}).join('. ')}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function h(d,k){var v=d[k];if(v==null)return false;if(Array.isArray(v))return v.length>0;if(typeof v==='string')return v.trim().length>0;return true}
function pos(d,k){if(!h(d,k)||!Array.isArray(d[k]))return[];return d[k].filter(function(x){var l=x.toLowerCase();return l.indexOf('brak ')<0&&l.indexOf('neguje')<0&&l.indexOf('nie dotyczy')<0&&l.indexOf('nie przyjmuje')<0&&l.indexOf('nie posiada')<0&&l.indexOf('nie stosował')<0&&l.indexOf('nic nie')<0&&l.indexOf('pacjent neguje')<0&&l.indexOf('bez objawów')<0&&l.indexOf('bez obciążeń')<0&&l.indexOf('zaprzecza')<0&&l.indexOf('odmawia')<0&&l.indexOf('pełna auto')<0&&l.indexOf('nie wzywano')<0&&l.indexOf('prawidłowy szmer')<0&&l.indexOf('bez zagrożenia')<0&&l.indexOf('bez zachowań')<0&&l.indexOf('bez wywiadu')<0&&l.indexOf('bez hipoglikemii')<0&&l.indexOf('bez leczenia')<0&&l.indexOf('bez krwawienia')<0&&l.indexOf('nie pamięta')<0&&l.indexOf('nigdy nie')<0&&l.indexOf('pacjent nie zna')<0&&l.indexOf('trzeźwy')<0&&l.indexOf('nie promieniuje')<0&&l.indexOf('bez promieniowania')<0&&l.indexOf('prawidłowa czynność')<0&&l.indexOf('bez skurczów')<0&&l.indexOf('bez deficytów')<0&&l.indexOf('bez widocznych')<0&&l.indexOf('bez dolegliwości')<0&&l.indexOf('bez obrażeń')<0&&l.indexOf('nie oceniano')<0&&l.indexOf('nie wykonywano')<0&&l.indexOf('brak oparzeń')<0&&l.indexOf('brak lokalizacji')<0})}
function isN(d,k,n){if(!h(d,k))return false;var v=d[k];if(Array.isArray(v))return v.some(function(x){return x.toLowerCase().indexOf(n.toLowerCase())>=0});return String(v).toLowerCase().indexOf(n.toLowerCase())>=0}

function hB(d){
  var p=[];
  if(h(d,'age'))p.push('Wiek: '+d.age.trim());
  if(h(d,'chronic')){var c=pos(d,'chronic');if(isN(d,'chronic','neguje'))p.push('Pacjent neguje choroby przewlekłe');else if(c.length){var ct=c.join(', ');if(h(d,'chronic_other'))ct+=', '+d.chronic_other.trim();p.push('W wywiadzie: '+ct);}}
  else if(h(d,'chronic_other'))p.push('W wywiadzie: '+d.chronic_other.trim());
  if(h(d,'medications_text'))p.push('Na stałe przyjmuje: '+d.medications_text.trim());
  if(h(d,'allergies')){if(isN(d,'allergies','neguje'))p.push('Alergie neguje');else if(h(d,'allergies_text'))p.push('Alergie: '+d.allergies_text.trim());}
  if(h(d,'substances')){var s=pos(d,'substances');if(isN(d,'substances','neguje'))p.push('Używki neguje');else if(s.length)p.push('Używki: '+s.join(', '));}
  if(h(d,'last_meal'))p.push('Ostatni posiłek: '+d.last_meal.trim());
  return p;
}
function nrs(d,k){if(!h(d,k))return'';var m=d[k].match(/(\d+-?\d*)/);return m?'NRS: '+m[1]+'/10':'';}
function symp(d,k){if(!h(d,k))return'';var s=pos(d,k);if(s.length)return'Towarzyszą: '+s.join(', ');if(isN(d,k,'bez objawów'))return'Bez istotnych objawów towarzyszących';return'';}

var CATS=[
  {k:'chest_pain',i:'\u2764\uFE0F',l:'Ból w kl. piersiowej',s:'ACS, dławica'},

];

var SC={

chest_pain:{steps:[
  {id:"c",title:"Okoliczności",fields:[
    {id:"onset_time",label:"Czas trwania",type:"single",options:["< 20 min","20-60 min","1-3 godz.","3-6 godz.","> 6 godz."]},
    {id:"onset_context",label:"Okoliczności",type:"single",options:["w spoczynku","przy wysiłku","po posiłku","w nocy — obudził ze snu","przy stresie","po kokainie / amfetaminie","po urazie klatki"]},
    {id:"first_episode",label:"Epizody w przeszłości",type:"single",options:["pierwszy epizod","bóle nawracające","podobny w przeszłości","hospitalizowany z tego powodu"]}
  ]},
  {id:"p",title:"Charakter bólu",fields:[

    {id:"pain_location",label:"Lokalizacja",type:"single",options:["zamostkowy","lewostronny","prawostronny","rozlany w klatce","w nadbrzuszu","międzyłopatkowy"]},
    {id:"radiation",label:"Promieniowanie",type:"multi",options:["do lewego barku","do lewego ramienia","do żuchwy","do pleców","do prawego barku","do szyi","do nadbrzusza","nie promieniuje"]},
    {id:"pain_nrs",label:"NRS",type:"single",options:["0 — ból ustąpił","1-3 łagodny","4-6 umiarkowany","7-8 silny","9-10 najsilniejszy"]},
    {id:"aggravating",label:"Nasila",type:"multi",options:["głęboki wdech","ruch / zmiana pozycji","wysiłek","połykanie","ucisk na klatkę","nic nie nasila"]},
    {id:"relieving",label:"Łagodzi",type:"multi",options:["odpoczynek","nitrogliceryna","pozycja siedząca","leki p-bólowe","nic nie łagodzi"]}
  ]},
  {id:"a",title:"Objawy towarzyszące",fields:[
    {id:"symptoms",label:"Objawy",type:"multi",options:["duszność","duszność spoczynkowa","nudności","wymioty","zimne poty","lęk","kołatanie serca","zawroty głowy","omdlenie","bladość","sinica","obrzęki kk. dolnych","kaszel","krwioplucie","gorączka","bez objawów towarzyszących"]},
    {id:"symptoms_other",label:"Inne objawy (wpisz)",type:"text",placeholder:"np. uczucie umierania, drętwienie kk. górnych..."}
  ]},
  {id:"h",title:"Wywiad",fields:[
    {id:"chronic",label:"Choroby przewlekłe",type:"multi",options:["nadciśnienie tętnicze","cukrzyca","choroba wieńcowa","po zawale serca","po PCI","po CABG","migotanie przedsionków","niewydolność serca","wada zastawkowa","POChP","astma","ch. zakrzepowo-zatorowa","hipercholesterolemia","otyłość","neguje choroby przewlekłe"]},

  ]}
],gen:function(d){
  var p=['Wezwanie z powodu bólu w klatce piersiowej'];
  if(h(d,'onset_context'))p.push('Dolegliwości wystąpiły '+d.onset_context);
  if(h(d,'onset_time')){var ot=d.onset_time.replace('< ','poniżej ').replace('> ','powyżej ');p.push('Ból trwa '+(ot.indexOf('poniżej')===0||ot.indexOf('powyżej')===0?'':'od ok. ')+ot);}

  {id:"c",title:"Okoliczności",fields:[
    {id:"reason",label:"Powód wezwania",type:"single",options:["upojenie alkoholowe — osoba leży","upojenie alkoholowe — agresja","upojenie alkoholowe — uraz","zatrucie alkoholem (podejrzenie metanolu/glikolu)","zespół odstawienia","majaczenie alkoholowe (delirium tremens)","drgawki alkoholowe","przewlekła choroba alkoholowa — pogorszenie"]},
    {id:"who_called",label:"Kto wezwał",type:"single",options:["przypadkowy świadek","rodzina","policja","sam pacjent","personel izby wytrzeźwień","personel DPS / noclegowni"]},
    {id:"where",label:"Gdzie znaleziony",type:"single",options:["mieszkanie / dom","ulica / park","klatka schodowa","lokal gastronomiczny","miejsce pracy","izba wytrzeźwień","inne"]},
    {id:"alcohol_type",label:"Rodzaj alkoholu",type:"single",options:["piwo","wódka / whisky","wino","alkohol niewiadomego pochodzenia","podejrzenie metanolu / glikolu","nieznany"]},
    {id:"amount",label:"Ilość",type:"text",placeholder:"np. ok. 0.5l wódki, kilka piw, nieznana ilość..."},
    {id:"last_drink",label:"Ostatnie spożycie",type:"text",placeholder:"np. ok. 2 godz. temu, pije od rana"}
  ]},
  {id:"s",title:"Stan",fields:[
    {id:"consciousness",label:"Świadomość",type:"single",options:["przytomny, kontaktowy","przytomny, kontakt utrudniony","przytomny, bełkotliwy, niekontaktowy","senny — budzi się na głos","senny — budzi się na ból","nieprzytomny"]},
    {id:"behavior",label:"Zachowanie",type:"multi",options:["spokojny, współpracujący","euforyczny","pobudzony","agresywny werbalnie","agresywny fizycznie","płaczliwy","apatyczny / wycofany","leży, nie reaguje na otoczenie"]},
    {id:"symptoms",label:"Objawy",type:"multi",options:["wymioty","nudności","ból głowy","zawroty głowy","ból brzucha","biegunka","uraz głowy — rana / krwiak","uraz twarzoczaszki","inne obrażenia widoczne","drgawki","drżenie rąk / ciała","omamy wzrokowe","omamy słuchowe","splątanie","pocenie się","gorączka","hipotermia","zaburzenia widzenia (metanol)","bez widocznych obrażeń","bez dodatkowych objawów"]},
    {id:"symptoms_other",label:"Inne objawy (wpisz)",type:"text",placeholder:"np. rana na potylicy, obrzęk stawu skokowego..."},
    {id:"airway",label:"Drogi oddechowe",type:"single",options:["drożne, oddech prawidłowy","zagrożone — wymioty / ślinotok","zagrożone — obniżony poziom świadomości","niedrożne — wymagają udrożnienia"]}
  ]},
  {id:"h",title:"Wywiad",fields:[
    {id:"alcohol_hist",label:"Wywiad alkoholowy",type:"single",options:["pije okazjonalnie","pije regularnie / nałogowo","uzależnienie rozpoznane","w trakcie leczenia odwykowego","po detoksie — nawrót","wielodniowy ciąg alkoholowy","odmawia informacji"]},
    {id:"withdrawal_hist",label:"Odstawienie w przeszłości",type:"multi",options:["drgawki alkoholowe w przeszłości","delirium tremens w przeszłości","hospitalizacja z powodu odstawienia","bez powikłań odstawienia","nie dotyczy"]},
    {id:"chronic",label:"Choroby",type:"multi",options:["padaczka","marskość wątroby","zapalenie trzustki","zapalenie żołądka","polineuropatia alkoholowa","cukrzyca","nadciśnienie","depresja","schizofrenia","neguje choroby przewlekłe","wywiad niedostępny"]},
    {id:"chronic_other",label:"Inne choroby (wpisz)",type:"text",placeholder:""},
    {id:"medications_text",label:"Leki",type:"text",placeholder:"np. disulfiram, karbamazepina, tiamina..."},
    {id:"allergies",label:"Alergie",type:"single",options:["neguje","nieznane","tak (wpisz poniżej)"]},
    {id:"allergies_text",label:"Jakie?",type:"text",placeholder:"",condition:{field:"allergies",value:"tak (wpisz poniżej)"}},
    {id:"other_subst",label:"Inne substancje",type:"multi",options:["benzodiazepiny","opioidy","dopalacze","leki (jakie — w uwagach)","pacjent neguje","brak możliwości ustalenia"]},
    {id:"notes",label:"Uwagi",type:"text",placeholder:"np. znaleziono puste butelki, obok leki, pacjent po upadku ze schodów..."}
  ]}
],gen:function(d){
  var p=[];if(h(d,'reason'))p.push('Wezwanie — '+d.reason);else p.push('Wezwanie do osoby w stanie upojenia alkoholowego');
  if(h(d,'who_called'))p.push('Zgłoszenie od: '+d.who_called);
  if(h(d,'where'))p.push('Miejsce: '+d.where);
  if(h(d,'alcohol_type')&&d.alcohol_type!=='nieznany')p.push('Rodzaj alkoholu: '+d.alcohol_type);
  if(h(d,'amount'))p.push('Ilość: '+d.amount.trim());
  if(h(d,'last_drink'))p.push('Ostatnie spożycie: '+d.last_drink.trim());
  if(h(d,'consciousness'))p.push('Świadomość: '+d.consciousness);
  if(h(d,'airway'))p.push('Drogi oddechowe: '+d.airway);
  if(h(d,'behavior')){var b=pos(d,'behavior');if(b.length)p.push('Zachowanie: '+b.join(', '));}
  if(h(d,'symptoms')){var s=pos(d,'symptoms');if(s.length)p.push('Objawy: '+s.join(', '));}
  if(h(d,'symptoms_other'))p.push(d.symptoms_other.trim());
  return J(p)+'.';
},genO:function(d){var p=[];if(h(d,'notes'))p.push(d.notes.trim());return p.length?J(p)+'.':'';},
warn:function(d){var w=[];if(!h(d,'consciousness'))w.push('Brak oceny świadomości');if(!h(d,'airway'))w.push('Brak oceny dróg oddechowych');if(!h(d,'symptoms'))w.push('Brak objawów');
  if(h(d,'reason')&&isN(d,'reason','metanol'))w.push('UWAGA: Podejrzenie metanolu/glikolu — pilna diagnostyka i leczenie');
  if(h(d,'reason')&&isN(d,'reason','delirium'))w.push('UWAGA: Delirium tremens — stan zagrożenia życia');
  if(h(d,'symptoms')&&isN(d,'symptoms','uraz głowy'))w.push('UWAGA: Uraz głowy — wykluczyć krwiak wewnątrzczaszkowy');
  return w;}
},

    {id:"onset",label:"Początek",type:"single",options:["nagły (godziny)","narastający (dni)","przewlekły z zaostrzeniem","po substancji","po odstawieniu substancji / leku"]},

    {id:"psych_hx_other",label:"Inne rozpoznania (wpisz)",type:"text",placeholder:"np. zaburzenia obsesyjno-kompulsyjne, anoreksja..."},
    {id:"psych_meds",label:"Leki psychiatryczne",type:"text",placeholder:"np. olanzapina, sertralina..."},
    {id:"compliance",label:"Compliance",type:"single",options:["przyjmuje regularnie","odstawił","nieregularnie","nigdy nie leczony","odmawia informacji"]},
    {id:"chronic",label:"Inne choroby",type:"multi",options:["padaczka","cukrzyca","nadciśnienie","choroby tarczycy","neguje inne choroby"]},
    {id:"chronic_other",label:"Inne choroby (wpisz)",type:"text",placeholder:""},
    {id:"allergies",label:"Alergie",type:"single",options:["neguje","tak (wpisz poniżej)"]},
    {id:"allergies_text",label:"Jakie?",type:"text",placeholder:"",condition:{field:"allergies",value:"tak (wpisz poniżej)"}}
  ]},
  {id:"e",title:"Dodatkowe",fields:[
    {id:"police",label:"Policja",type:"single",options:["na miejscu — asysta","wezwana","doprowadzony przez policję","nie wzywano"]},
    {id:"legal",label:"Status prawny",type:"single",options:["wyraża zgodę na transport","odmawia transportu","transport bez zgody — art. 21","zatrzymany przez policję","nie dotyczy"]},

],gen:function(d){
  var p=[];if(h(d,'reason'))p.push('Wezwanie: '+d.reason);else p.push('Interwencja psychiatryczna');
  if(h(d,'who'))p.push('Zgłoszenie: '+d.who);if(h(d,'onset'))p.push('Początek: '+d.onset);
  if(h(d,'consciousness'))p.push('Świadomość: '+d.consciousness);
  if(h(d,'behavior')){var b=pos(d,'behavior');if(b.length)p.push('Zachowanie: '+b.join(', '));}

},

// ZASŁABNIĘCIE
syncope:{steps:[
  {id:"c",title:"Okoliczności",fields:[
    {id:"loc",label:"Utrata przytomności",type:"single",options:["tak — pełna utrata przytomności","nie — zasłabnięcie bez utraty przytomności","nieokreślone / niejasne"]},
    {id:"loc_duration",label:"Czas utraty przytomności",type:"single",options:["< 30 s","30 s – 2 min","2-5 min","> 5 min","nie dotyczy"],condition:{field:"loc",value:"tak — pełna utrata przytomności"}},
    {id:"position",label:"Pozycja",type:"single",options:["stojąca","siedząca","leżąca","po zmianie pozycji z leżącej na stojącą"]},
    {id:"activity",label:"Okoliczności / aktywność",type:"single",options:["spoczynek","wysiłek fizyczny","zmiana pozycji ciała","długie stanie","oddawanie moczu / stolca","kaszel","ból / emocje","posiłek / po posiłku","bez uchwytnej przyczyny"]},
    {id:"context_other",label:"Szczegóły (wpisz)",type:"text",placeholder:"np. wstał gwałtownie, był w kościele..."}
  ]},
  {id:"p",title:"Objawy",fields:[
    {id:"prodromal",label:"Objawy zwiastunowe",type:"multi",options:["mroczki / ciemność przed oczami","szum w uszach","nudności","pocenie się","kołatanie serca","ból w kl. piersiowej","duszność","osłabienie","ból głowy","bez objawów zwiastunowych (nagłe)"]},
    {id:"during",label:"W trakcie epizodu",type:"multi",options:["drgawki","drgania kończyn (krótkie)","przygryzienie języka","mimowolne oddanie moczu","sinica","brak — epizod niepamięci"]},
    {id:"injury",label:"Uraz przy upadku",type:"single",options:["brak urazu","uraz głowy","rana / otarcie","inny uraz"]},
    {id:"injury_desc",label:"Opis urazu",type:"text",placeholder:"",condition:{field:"injury",value:"inny uraz"}}
  ]},
  {id:"a",title:"Po epizodzie",fields:[
    {id:"consciousness",label:"Świadomość",type:"single",options:["przytomny, orientacja pełna","przytomny, splątany","przytomny, spowolniały","nieprzytomny"]},
    {id:"recovery",label:"Powrót do normy",type:"single",options:["natychmiastowy","stopniowy (minuty)","przedłużone splątanie (> 5 min)","nie powrócił do normy"]},
    {id:"deficits",label:"Deficyty neurologiczne",type:"multi",options:["niedowład","asymetria twarzy","zaburzenia mowy","zaburzenia widzenia","drętwienie / parestezje","brak deficytów"]},
    {id:"recurrence",label:"Nawrotowość",type:"single",options:["pierwszy epizod w życiu","powtarzające się epizody","częste epizody (> 3 w roku)"]},
    {id:"notes",label:"Uwagi",type:"text",placeholder:"np. dodatkowe okoliczności, obserwacje świadków..."}
  ]}
],gen:function(d){
  var p=['Wezwanie z powodu zasłabnięcia'];
  if(h(d,'loc')){var l=d.loc;if(l.indexOf('tak')===0)p.push('Z utratą przytomności');else if(l.indexOf('nie')===0)p.push('Bez utraty przytomności');else p.push('Utrata przytomności nieokreślona');}
  if(h(d,'loc_duration')&&d.loc_duration!=='nie dotyczy')p.push('Czas trwania utraty przytomności: '+d.loc_duration.replace('< ','poniżej ').replace('> ','powyżej '));
  if(h(d,'position'))p.push('Pozycja: '+d.position);
  if(h(d,'activity')&&d.activity!=='bez uchwytnej przyczyny')p.push('Okoliczności: '+d.activity);
  else if(d.activity==='bez uchwytnej przyczyny')p.push('Bez uchwytnej przyczyny');
  if(h(d,'context_other'))p.push(d.context_other.trim());
  if(h(d,'prodromal')){var pr=pos(d,'prodromal');if(pr.length)p.push('Objawy zwiastunowe: '+pr.join(', '));else if(isN(d,'prodromal','bez objawów'))p.push('Epizod nagły, bez objawów zwiastunowych');}
  if(h(d,'during')){var du=pos(d,'during');if(du.length)p.push('W trakcie epizodu: '+du.join(', '));else if(isN(d,'during','brak'))p.push('Brak dodatkowych objawów w trakcie epizodu');}
  if(h(d,'injury')&&d.injury!=='brak urazu'){p.push('Uraz przy upadku: '+d.injury);if(h(d,'injury_desc'))p.push(d.injury_desc.trim());}
  if(h(d,'consciousness'))p.push('Świadomość: '+d.consciousness);
  if(h(d,'recovery'))p.push('Powrót do normy: '+d.recovery);
  if(h(d,'deficits')){var df=pos(d,'deficits');if(df.length)p.push('Deficyty neurologiczne: '+df.join(', '));else if(isN(d,'deficits','brak'))p.push('Bez deficytów neurologicznych');}
  if(h(d,'recurrence'))p.push(cap(d.recurrence));
  return J(p)+'.';
},genO:function(d){var p=[];if(h(d,'notes'))p.push(d.notes.trim());return p.length?J(p)+'.':'';},
warn:function(d){var w=[];if(!h(d,'loc'))w.push('Brak info o utracie przytomności');if(!h(d,'activity'))w.push('Brak okoliczności');if(!h(d,'prodromal'))w.push('Brak objawów zwiastunowych');if(!h(d,'consciousness'))w.push('Brak świadomości po epizodzie');if(!h(d,'recovery'))w.push('Brak powrotu do normy');if(!h(d,'deficits'))w.push('Brak deficytów');return w;}
},

general:{steps:[
  {id:"a",title:"Opis zdarzenia",fields:[

var cur=null,step=0,D={},allSteps=[];

function sv(){document.querySelectorAll('[data-f]').forEach(function(el){D[el.dataset.f]=el.value})}

function render(){
  var s=allSteps[step];
  document.getElementById('si').innerHTML=allSteps.map(function(x,i){return'<div class="sd'+(i<step?' d':i===step?' cur':'')+'"></div>'}).join('');
  var htm='<div class="st">'+s.title+'</div>';
  s.fields.forEach(function(f){
    if(f.condition&&D[f.condition.field]!==f.condition.value)return;
    htm+='<div class="fl">'+f.label+'</div>';
    if(f.type==='single'){htm+='<div class="fg">';f.options.forEach(function(o){htm+='<div class="c'+(D[f.id]===o?' s':'')+'" onclick="s1(\''+e(f.id)+'\',\''+e(o)+'\')">'+o+'</div>'});htm+='</div>';}
    else if(f.type==='multi'){htm+='<div class="fg">';f.options.forEach(function(o){htm+='<div class="c m'+((D[f.id]||[]).indexOf(o)>=0?' s':'')+'" onclick="sM(\''+e(f.id)+'\',\''+e(o)+'\')">'+o+'</div>'});htm+='</div>';}
    else if(f.type==='text'){htm+='<input class="ti" type="text" data-f="'+f.id+'" placeholder="'+e(f.placeholder||'')+'" value="'+e(D[f.id]||'')+'">';}
  });
  document.getElementById('fc').innerHTML=htm;
  document.getElementById('bP').style.display=step===0?'none':'';
  document.getElementById('bN').textContent=step===allSteps.length-1?'Generuj tekst':'Dalej';
}
function e(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;')}
function s1(f,v){sv();D[f]=D[f]===v?null:v;render()}
function sM(f,v){sv();if(!D[f])D[f]=[];var i=D[f].indexOf(v);if(i>=0)D[f].splice(i,1);else D[f].push(v);render()}

function genOut(){
  sv();var w=cur.gen(D),o=cur.genO(D),sam=hB(D),warn=cur.warn(D);
  var full=w;
  if(sam.length)full+='\n\n'+J(sam)+'.';
  if(o)full+='\n\n'+o;
  document.getElementById('oo').textContent=full;
  var total=allSteps.reduce(function(s,st){return s+st.fields.filter(function(f){return!f.condition}).length},0);
  var filled=Object.keys(D).filter(function(k){var v=D[k];if(Array.isArray(v))return v.length>0;if(typeof v==='string')return v.trim().length>0;return v!=null}).length;
  var pct=Math.min(100,Math.round(filled/total*100));
  var fl=document.getElementById('cpf');fl.style.width=pct+'%';fl.style.background=pct>=80?'var(--gn)':pct>=50?'var(--yl)':'var(--rd)';
  document.getElementById('cpl').textContent=pct+'%';document.getElementById('cpl').style.color=fl.style.background;
  var wC=document.getElementById('wc');
  if(warn.length)wC.innerHTML='<div class="wb"><div class="wt">Rozważ uzupełnienie</div>'+warn.map(function(x){return'<div class="wi">'+x+'</div>'}).join('')+'</div>';
  else wC.innerHTML='<div class="ok">Dokumentacja kompletna</div>';
  show('s2');
}
